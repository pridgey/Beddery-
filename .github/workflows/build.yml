name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      # Release signing is optional. Without these secrets the release APK is signed with a debug key.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version name
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "BEDDERY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint, unit tests and build
        env:
          BEDDERY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BEDDERY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BEDDERY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # github = the self-updating APK for GitHub Releases; play = the bundle for Google Play.
        run: >-
          ./gradlew lintGithubDebug lintPlayRelease testGithubDebugUnitTest
          assembleGithubDebug assembleGithubRelease bundlePlayRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: beddery-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Upload this to Play Console by hand (or automate it later). It's kept out of the
      # GitHub release, whose download pattern only matches beddery-* artifacts.
      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle-${{ env.VERSION_NAME }}
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/

  release:
    name: Publish GitHub release
    # Every push to main (or a manual v* tag) becomes a release. Pull requests only build.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: beddery-*
          merge-multiple: true
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Beddery ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: apks/**/*-release.apk
          generate_release_notes: true
          make_latest: true
